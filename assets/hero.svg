<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">

  <defs>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#111a32"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#6b5cff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <radialGradient id="blueLight">
      <stop offset="0%" stop-color="#247bff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="redLight">
      <stop offset="0%" stop-color="#ff354f" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".08"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="520" rx="32" fill="url(#background)"/>

  <rect width="1200" height="520" rx="32" fill="url(#dots)"/>


  <!-- AMBIENT LIGHT -->

  <circle cx="70" cy="80" r="220" fill="url(#blueLight)">
    <animate
      attributeName="opacity"
      values=".55;.9;.55"
      dur="5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1140" cy="450" r="240" fill="url(#redLight)">
    <animate
      attributeName="opacity"
      values=".45;.8;.45"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>


  <!-- OUTER BORDER -->

  <rect
    x="2"
    y="2"
    width="1196"
    height="516"
    rx="30"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"/>

  <rect
    x="12"
    y="12"
    width="1176"
    height="496"
    rx="24"
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".05"
    stroke-width="1"/>


  <!-- TOP STATUS -->

  <circle cx="76" cy="70" r="6" fill="#247bff">
    <animate
      attributeName="opacity"
      values="1;.3;1"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <text
    x="94"
    y="76"
    fill="#8fa4c9"
    font-family="monospace"
    font-size="15"
    letter-spacing="3">
    SHAHZAIB-77 / PROFILE
  </text>


  <!-- SMALL DECORATIVE LINE -->

  <rect
    x="80"
    y="115"
    width="95"
    height="3"
    rx="2"
    fill="#247bff"/>

  <rect
    x="180"
    y="115"
    width="45"
    height="3"
    rx="2"
    fill="#ff354f"/>


  <!-- MAIN INTRO -->

  <text
    x="80"
    y="175"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="400">
    Hello, I'm
  </text>


  <text
    x="76"
    y="255"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="-3">
    SHAHZAIB
  </text>


  <!-- ANIMATED ACCENT -->

  <rect
    x="80"
    y="278"
    width="420"
    height="5"
    rx="3"
    fill="url(#accent)">

    <animate
      attributeName="width"
      values="80;420;300;420"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ROLE -->

  <text
    x="80"
    y="330"
    fill="#f5f7fb"
    font-family="monospace"
    font-size="20"
    font-weight="600">
    FLUTTER DEVELOPER
  </text>

  <text
    x="80"
    y="365"
    fill="#247bff"
    font-family="monospace"
    font-size="20"
    font-weight="600">
    + GENERATIVE AI ENGINEER
  </text>


  <!-- LOCATION -->

  <text
    x="80"
    y="415"
    fill="#8493ad"
    font-family="monospace"
    font-size="16">
    ◉ ISLAMABAD, PAKISTAN
  </text>


  <!-- RIGHT PROFILE PANEL -->

  <rect
    x="780"
    y="80"
    width="330"
    height="360"
    rx="28"
    fill="#0b1222"
    fill-opacity=".75"
    stroke="#247bff"
    stroke-opacity=".28"
    stroke-width="1.5"/>


  <!-- PANEL HEADER -->

  <text
    x="815"
    y="120"
    fill="#7183a4"
    font-family="monospace"
    font-size="13"
    letter-spacing="2">
    DIGITAL ID
  </text>


  <!-- ORBIT -->

  <circle
    cx="945"
    cy="245"
    r="105"
    fill="none"
    stroke="#247bff"
    stroke-opacity=".12"
    stroke-width="1"/>

  <circle
    cx="945"
    cy="245"
    r="78"
    fill="none"
    stroke="#ff354f"
    stroke-opacity=".10"
    stroke-width="1"/>


  <!-- ROTATING ORBIT -->

  <g transform="translate(945 245)">
    <circle
      cx="105"
      cy="0"
      r="5"
      fill="#247bff"
      filter="url(#softGlow)">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="7s"
        repeatCount="indefinite"/>

    </circle>
  </g>


  <!-- CENTER MONOGRAM -->

  <circle
    cx="945"
    cy="245"
    r="65"
    fill="#070b16"
    stroke="url(#accent)"
    stroke-width="2"/>

  <text
    x="945"
    y="260"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="43"
    font-weight="800">
    SW
  </text>


  <!-- PANEL FOOTER -->

  <text
    x="945"
    y="350"
    text-anchor="middle"
    fill="#247bff"
    font-family="monospace"
    font-size="14"
    letter-spacing="2">
    BUILD • CREATE • SHIP
  </text>

  <line
    x1="840"
    y1="380"
    x2="1050"
    y2="380"
    stroke="#ffffff"
    stroke-opacity=".08"/>

  <text
    x="945"
    y="410"
    text-anchor="middle"
    fill="#687994"
    font-family="monospace"
    font-size="12">
    SOFTWARE ENGINEERING
  </text>


  <!-- CORNER DETAILS -->

  <circle cx="1140" cy="70" r="3" fill="#ff354f"/>
  <circle cx="1152" cy="70" r="3" fill="#247bff"/>
  <circle cx="1164" cy="70" r="3" fill="#ffffff" opacity=".4"/>


  <!-- BOTTOM GRADIENT -->

  <rect
    x="80"
    y="468"
    width="1040"
    height="1"
    fill="url(#accent)"
    opacity=".35"/>

</svg>
