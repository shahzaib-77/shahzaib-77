<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#0a1024"/>
    </linearGradient>

    <linearGradient id="projBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <style>
      .proj-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 18px; fill: #f0f4fc; letter-spacing: 1px; }
      .card-name { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: #38bdf8; }
      .card-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-tag { font-family: 'Fira Code', monospace; font-size: 11px; fill: #cbd5e1; }
      .card-stat { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 12px; fill: #6ee7b7; }
    </style>
  </defs>

  <rect width="800" height="440" rx="16" fill="url(#projBg)"/>
  <rect width="798" height="438" x="1" y="1" rx="15" fill="none" stroke="url(#projBorder)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(35, 35)">
    <text x="0" y="0" class="proj-title">🚀 FLAGSHIP PROJECTS &amp; INNOVATIONS</text>
  </g>

  <!-- 3 Showcase Cards Grid -->
  <g transform="translate(35, 65)">

    <!-- Card 1: AI Agent Swarm -->
    <g transform="translate(0, 0)">
      <rect width="730" height="100" rx="12" fill="#0d162a" stroke="#247bff" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="35" cy="50" r="22" fill="#247bff" fill-opacity="0.2"/>
      <text x="27" y="56" font-size="20">🤖</text>

      <text x="75" y="34" class="card-name">Zaphtech AI Agent Orchestrator</text>
      <text x="75" y="54" class="card-sub">Autonomous multi-agent task execution engine with LLM tool calling &amp; RAG memory.</text>
      
      <!-- Tech Tags -->
      <g transform="translate(75, 66)">
        <rect width="70" height="20" rx="4" fill="#1e293b"/>
        <text x="8" y="14" class="card-tag">Python</text>

        <rect x="78" width="90" height="20" rx="4" fill="#1e293b"/>
        <text x="86" y="14" class="card-tag">LangChain</text>

        <rect x="176" width="75" height="20" rx="4" fill="#1e293b"/>
        <text x="184" y="14" class="card-tag">FastAPI</text>
      </g>

      <!-- Stat Badge -->
      <g transform="translate(560, 35)">
        <rect width="140" height="30" rx="6" fill="#064e3b" stroke="#10b981"/>
        <text x="12" y="20" class="card-stat">⚡ 10x Velocity</text>
      </g>
    </g>

    <!-- Card 2: Flutter Mobile Suite -->
    <g transform="translate(0, 115)">
      <rect width="730" height="100" rx="12" fill="#0d162a" stroke="#ff354f" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="35" cy="50" r="22" fill="#ff354f" fill-opacity="0.2"/>
      <text x="27" y="56" font-size="20">📱</text>

      <text x="75" y="34" class="card-name" fill="#ff758f">Cross-Platform Flutter Mobile Suite</text>
      <text x="75" y="54" class="card-sub">Ultra-fluid cross-platform mobile apps built with Dart, 120 FPS animations &amp; offline DB.</text>
      
      <!-- Tech Tags -->
      <g transform="translate(75, 66)">
        <rect width="70" height="20" rx="4" fill="#1e293b"/>
        <text x="8" y="14" class="card-tag">Flutter</text>

        <rect x="78" width="60" height="20" rx="4" fill="#1e293b"/>
        <text x="86" y="14" class="card-tag">Dart</text>

        <rect x="146" width="85" height="20" rx="4" fill="#1e293b"/>
        <text x="154" y="14" class="card-tag">REST API</text>
      </g>

      <!-- Stat Badge -->
      <g transform="translate(560, 35)">
        <rect width="140" height="30" rx="6" fill="#4c1d95" stroke="#a855f7"/>
        <text x="12" y="20" class="card-stat" fill="#c084fc">🚀 120 FPS UI</text>
      </g>
    </g>

    <!-- Card 3: Full-Stack Web Platform -->
    <g transform="translate(0, 230)">
      <rect width="730" height="100" rx="12" fill="#0d162a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="35" cy="50" r="22" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="27" y="56" font-size="20">⚡</text>

      <text x="75" y="34" class="card-name">Full-Stack Cloud Enterprise Web App</text>
      <text x="75" y="54" class="card-sub">Modern React 19 &amp; Next.js 15 cloud architecture with microservices &amp; real-time sockets.</text>
      
      <!-- Tech Tags -->
      <g transform="translate(75, 66)">
        <rect width="75" height="20" rx="4" fill="#1e293b"/>
        <text x="8" y="14" class="card-tag">Next.js</text>

        <rect x="83" width="90" height="20" rx="4" fill="#1e293b"/>
        <text x="91" y="14" class="card-tag">TypeScript</text>

        <rect x="181" width="70" height="20" rx="4" fill="#1e293b"/>
        <text x="189" y="14" class="card-tag">Docker</text>
      </g>

      <!-- Stat Badge -->
      <g transform="translate(560, 35)">
        <rect width="140" height="30" rx="6" fill="#064e3b" stroke="#10b981"/>
        <text x="12" y="20" class="card-stat">🔥 99.9% Uptime</text>
      </g>
    </g>

  </g>
</svg>