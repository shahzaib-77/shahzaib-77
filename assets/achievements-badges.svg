<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <linearGradient id="achieveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#0b1124"/>
    </linearGradient>

    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <style>
      .ach-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 18px; fill: #f0f4fc; letter-spacing: 1px; }
      .badge-lbl { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 13px; fill: #f0f4fc; }
      .badge-sub { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="800" height="260" rx="16" fill="url(#achieveBg)"/>
  <rect width="798" height="258" x="1" y="1" rx="15" fill="none" stroke="url(#hexGrad)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(35, 35)">
    <text x="0" y="0" class="ach-title">🏆 HONORS &amp; CYBER ACHIEVEMENTS</text>
  </g>

  <!-- 4 Badges Row -->
  <g transform="translate(35, 60)">
    
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="150" rx="14" fill="#0d172a" stroke="#247bff" stroke-width="1.5"/>
      <polygon points="82,25 105,38 105,65 82,78 59,65 59,38" fill="#247bff" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
      <text x="82" y="57" text-anchor="middle" font-size="22">🥇</text>

      <text x="82" y="102" text-anchor="middle" class="badge-lbl">AI Architect</text>
      <text x="82" y="122" text-anchor="middle" class="badge-sub">Multi-Agent Master</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(188, 0)">
      <rect width="165" height="150" rx="14" fill="#0d172a" stroke="#ff354f" stroke-width="1.5"/>
      <polygon points="82,25 105,38 105,65 82,78 59,65 59,38" fill="#ff354f" fill-opacity="0.2" stroke="#ff758f" stroke-width="2"/>
      <text x="82" y="57" text-anchor="middle" font-size="22">⚡</text>

      <text x="82" y="102" text-anchor="middle" class="badge-lbl" fill="#ff758f">Full-Stack Titan</text>
      <text x="82" y="122" text-anchor="middle" class="badge-sub">React &amp; Next.js Pro</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(376, 0)">
      <rect width="165" height="150" rx="14" fill="#0d172a" stroke="#10b981" stroke-width="1.5"/>
      <polygon points="82,25 105,38 105,65 82,78 59,65 59,38" fill="#10b981" fill-opacity="0.2" stroke="#6ee7b7" stroke-width="2"/>
      <text x="82" y="57" text-anchor="middle" font-size="22">📱</text>

      <text x="82" y="102" text-anchor="middle" class="badge-lbl" fill="#6ee7b7">Flutter Craftsman</text>
      <text x="82" y="122" text-anchor="middle" class="badge-sub">120 FPS Mobile Apps</text>
    </g>

    <!-- Badge 4: Zaphtech Founder & CEO -->
    <g transform="translate(564, 0)">
      <rect width="165" height="150" rx="14" fill="#0d172a" stroke="#a855f7" stroke-width="1.5"/>
      <polygon points="82,25 105,38 105,65 82,78 59,65 59,38" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-width="2"/>
      <text x="82" y="57" text-anchor="middle" font-size="22">👑</text>

      <text x="82" y="102" text-anchor="middle" class="badge-lbl" fill="#c084fc">Zaphtech Founder</text>
      <text x="82" y="122" text-anchor="middle" class="badge-sub">CEO &amp; Agency Lead</text>
    </g>

  </g>
</svg>