<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 65" width="100%" height="100%">
  <defs>
    <linearGradient id="navBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0f1935"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>

    <linearGradient id="navBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <style>
      .btn-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 12px; fill: #f0f4fc; }
      .btn-sub { font-family: 'Fira Code', monospace; font-size: 11px; fill: #38bdf8; font-weight: 700; }
    </style>
  </defs>

  <rect width="800" height="65" rx="14" fill="url(#navBg)"/>
  <rect width="798" height="63" x="1" y="1" rx="13" fill="none" stroke="url(#navBorder)" stroke-width="1.5"/>

  <!-- Button 1: Email -->
  <g transform="translate(18, 12)">
    <rect width="210" height="40" rx="20" fill="#16233b" stroke="#247bff" stroke-width="1.2"/>
    <circle cx="22" cy="20" r="11" fill="#247bff" fill-opacity="0.25"/>
    <text x="17" y="24" font-size="12">📧</text>
    <text x="40" y="24" class="btn-lbl">m.shahzaibwajid0647@gmail.com</text>
  </g>

  <!-- Button 2: GitHub -->
  <g transform="translate(240, 12)">
    <rect width="165" height="40" rx="20" fill="#16233b" stroke="#ff354f" stroke-width="1.2"/>
    <circle cx="22" cy="20" r="11" fill="#ff354f" fill-opacity="0.25"/>
    <text x="17" y="24" font-size="12">🐙</text>
    <text x="40" y="24" class="btn-lbl" fill="#ff758f">github/shahzaib-77</text>
  </g>

  <!-- Button 3: Zaphtech Founder & CEO -->
  <g transform="translate(417, 12)">
    <rect width="200" height="40" rx="20" fill="#16233b" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="22" cy="20" r="11" fill="#a855f7" fill-opacity="0.25"/>
    <text x="17" y="24" font-size="12">👑</text>
    <text x="40" y="24" class="btn-lbl" fill="#c084fc">Zaphtech Agency (CEO)</text>
  </g>

  <!-- Button 4: Hire Status -->
  <g transform="translate(629, 12)">
    <rect width="152" height="40" rx="20" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="20" cy="20" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="24" class="btn-lbl" fill="#6ee7b7">Available for Hire</text>
  </g>
</svg>