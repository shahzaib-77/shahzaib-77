<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>M. Shahzaib - GitHub Profile Preview</title>
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 820px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .card {
      background: #0b0f19;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      background: linear-gradient(90deg, #247bff, #38bdf8, #ff354f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <h1>M. Shahzaib - Animated GitHub Profile Preview</h1>
  <div class="container">
    <div class="card"><img src="./assets/hero.svg" width="100%" /></div>
    <div class="card"><img src="./assets/about-life.svg" width="100%" /></div>
    <div class="card"><img src="./assets/stack.svg" width="100%" /></div>
    <div class="card"><img src="./assets/id-dashboard.svg" width="100%" /></div>
    <div class="card"><img src="./assets/connect.svg" width="100%" /></div>
  </div>
</body>
</html>
